[package]
name = "app"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Independent workspace so the heavy Tauri/webview build stays out of the
# core/cli workspace and its fast CI checks.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The write-once engine, with all real backends (whisper, cpal, injection, hotkey).
orttaai-core = { path = "../../core", features = ["full", "express"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Opt-in diagnostics: ORTTAAI_LOG=info writes orttaai.log (technical events only,
# never dictations or personal data) to the data folder.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Analytics/home: share-card PNGs arrive base64-encoded and are saved to the
# user's Pictures folder.
base64 = "0.22"
directories = "5"
tauri-plugin-dialog = "2"

# Native Wayland typing via the RemoteDesktop portal is Linux-only; Cargo unions
# these features with the base dependency, so Windows builds never pull in ashpd.
[target."cfg(target_os = \"linux\")".dependencies]
orttaai-core = { path = "../../core", features = ["portal"] }

# Opt-in GPU builds: `cargo build --features vulkan` (cross-platform default) or
# `--features cuda` (NVIDIA-only variant). Off by default → CPU build.
[features]
vulkan = ["orttaai-core/vulkan"]
cuda = ["orttaai-core/cuda"]

