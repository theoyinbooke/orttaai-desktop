# Windows: link the C runtime statically (/MT). sherpa-onnx's prebuilt ONNX
# Runtime libs are /MT, so whisper.cpp (built by cmake-rs, which follows this
# flag) must match — and the installer then needs no VC++ redistributable.
# libucrt.lib (the static Universal CRT, where expf/logf live) is named
# explicitly: a clean cargo-xwin build otherwise leaves them unresolved.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=libucrt.lib"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=libucrt.lib"]

# whisper.cpp itself must ALSO be compiled /MT. whisper-rs-sys forwards CMAKE_*
# env vars to CMake, and `[env]` here can't be scoped per target, so Windows
# builds export these (see scripts/windows-crt-env.sh / .ps1 and release.yml):
#   CMAKE_C_FLAGS_RELEASE / CMAKE_CXX_FLAGS_RELEASE        = "/MT /O2 /Ob2 /DNDEBUG"
#   CMAKE_C_FLAGS_RELWITHDEBINFO / CMAKE_CXX_FLAGS_RELWITHDEBINFO = "/MT /O2 /Ob1 /DNDEBUG"
#   CMAKE_C_FLAGS_DEBUG / CMAKE_CXX_FLAGS_DEBUG            = "/MT /Od"
